name: CD - DEV

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Deploy DEV
    runs-on: self-hosted

    steps:
      - name: Update DEV source code
        working-directory: /opt/apps/myGarage/dev/myGarage
        run: |
          git pull origin develop

      - name: Rebuild and restart DEV containers
        working-directory: /opt/apps/myGarage/dev/myGarage
        run: |
          docker compose up -d --build